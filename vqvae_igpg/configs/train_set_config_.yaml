model:
  base_learning_rate: 4.5e-06
  target: vqvae_igpg.models.condvqvae_models.VQModel
  params:
    learning_rate: 1.0e-4
    embed_dim: 256
    n_embed:  1024 #8192

    ddconfig:
      cch: 1 # condition in channel
      double_z: False
      tanh_out: False
      z_channels: 16 #256
      resolution: 64 #256
      in_channels: 3
      my_channels: 1
      out_ch: 3
      ch: 256
      ch_mult: [ 1,4, 4]   # [ 1,1, 1, 2,2]#num_down = len(ch_mult)-1
      num_res_blocks: 6
      attn_resolutions: [2, 4]
      dropout: 0.0
      in_dim: 12288
      fdim: 12288
      ln_proj: True

    lossconfig:
      target: vqvae_igpg.modules.losses.vqperceptual.VQLPIPSNoDiscriminator
      params:
        disc_input_size: 64
        is_reshape: True
        disc_in_channels: 3
        codebook_weight: 1.0
        n_classes: 1024

#    lossconfig:
#      target: vqvae_igpg.modules.losses.losses.VQLoss
#      params:
#        codebook_weight: 1.0
#        n_classes: 1024

    cond_stage_config:
      target: vqvae_igpg.modules.conditionmodules.Conditioner
      params:
        hf_method: "google-t5/t5-small"
        hf_max_length: 512
        arch_emb_dim: 1024
        layer_emb_dim: 512
        chunk_emb_dim: 32
        output_emb_dim: 256
        max_num_chunks: 11079 #1232  #42730 #499921
        to_img: True
        out_ch: 1
        out_size: 16

data:
  target: zooloaders.ldm_zooloader.ZooDataModule
  params:
    batch_size: 100
    num_workers: 16
    zoo_root: '../zoodatasets_train_tiny_subset_v2'
    zoo_split: "train_tiny_subset-2"
    length: 12288
    resolution: 64
    to_image: True
    in_channel: 3
#    resolution:
    topk: null
    scale: 1.0

#    data_dir = '../zoodatasets_train_tiny'
#    file_name = 'modelzoos/zoo_config.simple_config.yaml'
#    target_set = "train_tiny"


