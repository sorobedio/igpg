model:
  base_learning_rate: 4.5e-06
  target: vqvae_igpg.models.first_stage_vqvae_model.GumbelVQNoDisc
  params:
    learning_rate: 7.5e-5
    embed_dim: 16
    n_embed: 16
#    monitor: val/rec_loss
    temperature_scheduler_config:
      target: vqvae_igpg.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 0
        max_decay_steps: 10000001
        lr_start: 1.0
        lr_max: 1.0
        lr_min: 1.0e-5
    ddconfig:
      double_z: False
      tanh_out: False
      z_channels: 16
      resolution: 64
      in_channels: 3
      my_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2, 2, 2]  #num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [  ]
      dropout: 0.0
      in_dim: 4096
      fdim: 4096
    lossconfig:
      target: vqvae_igpg.modules.losses.losses.VQLoss
      params:
        codebook_weight: 1.0


data:
  target: zooloaders.vqvae_loader.ZooDataModule
  params:
    data_dir: "../Datasets"
    data_root: "../Datasets/data/"
    batch_size: 128
    num_workers: 8
    scale: 0.1
    dataset: "joint"
    topk: null
    normalize: False
