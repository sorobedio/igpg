model:
  base_learning_rate: 4.5e-06
  target: vqvae_igpg.models.condvqvae_models.GumbelVQNoDisc
  params:
    learning_rate: 2.5e-5
    embed_dim: 256
    n_embed:  512 #8192
#    ckpt_path: "autocheckpoints/model_tiny_sub_model_subset_64.pt"
#    monitor: val/rec_loss
    temperature_scheduler_config:
      target: vqvae_igpg.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 0
        max_decay_steps: 1000001
        lr_start: 0.95
        lr_max: 0.95
        lr_min: 1.0e-4
    ddconfig:
      cch: 4 # condition in channel
      double_z: False
      tanh_out: True
      z_channels: 16 #256
      resolution: 64 #256
      in_channels: 3
      my_channels: 1
      out_ch: 3
      ch: 128
      ch_mult: [ 1, 2, 4]  #num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [  ]
      dropout: 0.0
      in_dim: 12288
      fdim: 12288
      ln_proj: True
#      tan_out: True
    lossconfig:
      target: vqvae_igpg.modules.losses.losses.VQLoss
      params:
        codebook_weight: 1.0
        n_classes: 512

    cond_stage_config:
      target: vqvae_igpg.modules.conditionmodules.Conditioner
      params:
        hf_method: "google-t5/t5-small"
        hf_max_length: 512
        arch_emb_dim: 1024
        layer_emb_dim: 512
        chunk_emb_dim: 32
        output_emb_dim: 1024
        max_num_chunks: 11079  #42730 #499921
        to_img: True
        out_ch: 4
        out_size: 16

data:
  target: zooloaders.ldm_zooloader.ZooDataModule
  params:
    batch_size: 100
    num_workers: 16
    zoo_root: '../zoodatasets_train_tiny_subset_64'
    zoo_split: "train_tiny_subset-2"
    length: 12288
    resolution: 64
    to_image: True
    in_channel: 3
#    resolution:
    topk: null
    scale: 1.0

#    data_dir = '../zoodatasets_train_tiny'
#    file_name = 'modelzoos/zoo_config.simple_config.yaml'
#    target_set = "train_tiny"


