model:
  base_learning_rate: 4.5e-6
  target: vqvae_igpg.models.vqvae_models.VQNoDiscModel
  params:
    learning_rate: 2.13e-5
    embed_dim: 16
    n_embed: 256
    ddconfig:
      double_z: False
      z_channels: 4
      resolution: 256
      in_channels: 1
      my_channels: 12
      out_ch: 1
      ch: 128
      ch_mult: [ 1,1,2,2 ]  # num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [ 8 ]
      dropout: 0.0
      in_dim: 16384
      fdim: 16384

    lossconfig:
      target: vqvae_igpg.modules.losses.losses.VQLoss
      params:
        codebook_weight: 1.0

#
data:
  target: zooloaders.weight_dataloader.ZooDataModule
  params:
    zoo_root:  '../zoodatasets'
    zoo_split: 'train_7_8B_models'
    length: 196608
    resolution: 256
    to_image: False
    in_channel: 3
    topk: null
    scale: 0.025
    batch_size: 30
    num_workers: 16
