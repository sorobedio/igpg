data:
  target: zooloaders.chunk_dataloader.ZooDataModule
  params:
    root: 'modelzoos'
    dataset: "gemma-3-4b-it" #  "train_1b_models" #
    zoo_file: 'zoo_config.simple_config.yaml'
    split: 'train'
    topk: null
    scale: 0.025
    transform: null
    normalize: False
    tgt: ['up_proj']
    exd: [ '.bias', 'norm' ]
    length: 768
    n_tok: 256
    batch_size: 512
    num_workers: 16