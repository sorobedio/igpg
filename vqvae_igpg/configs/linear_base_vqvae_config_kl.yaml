model:
  base_learning_rate: 4.5e-6
  target: vqvae_igpg.models.linear_vqvae.GumbelVQNoDisc
  params:
    learning_rate: 2.13e-5
    embed_dim: 8192
    n_embed: 64
    temperature_scheduler_config:
      target: vqvae_igpg.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 0
        max_decay_steps: 10000001
        lr_start: 1.0
        lr_max: 1.0
        lr_min: 1.0e-4
    ddconfig:
      double_z: False
      z_channels: 64
      resolution: 512
      in_channels: 256
      out_ch: 256
      ch: 128
      ch_mult: [ 1,1,2,2 ]  # num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [ 8 ]
      dropout: 0.0
      in_dim: 768

    lossconfig:
      target: vqvae_igpg.modules.losses.losses.VQLoss
      params:
        codebook_weight: 1.0

