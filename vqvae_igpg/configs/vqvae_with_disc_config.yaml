model:
  base_learning_rate: 4.5e-06
  target: vqvae_igpg.models.first_stage_vqvae_model.GumbelVQ
  params:
    learning_rate: 7.5e-5
    embed_dim: 256
    n_embed:  1024 #8192
#    monitor: val/rec_loss
    temperature_scheduler_config:
      target: vqvae_igpg.lr_scheduler.LambdaWarmUpCosineScheduler
      params:
        warm_up_steps: 0
        max_decay_steps: 1000001
        lr_start: 0.95
        lr_max: 0.95
        lr_min: 1.0e-5
    ddconfig:
      double_z: False
      tanh_out: False
      z_channels: 16 #256
      resolution: 64 #256
      in_channels: 3
      my_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [ 1,2, 4]  #num_down = len(ch_mult)-1
      num_res_blocks: 2
      attn_resolutions: [  ]
      dropout: 0.0
      in_dim: 4096
      fdim: 4096
    lossconfig:
      target: vqvae_igpg.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_input_size: 64
        is_reshape: True
        disc_conditional: false
        disc_in_channels: 3
        disc_start: 0
        disc_weight: 0.75
        disc_num_layers: 2
        codebook_weight: 1.0


data:
  target: zooloaders.vqvae_loader.ZooDataModule
  params:
    data_dir: "../Datasets"
    data_root: "../Datasets/data/"
    batch_size: 128
    num_workers: 8
    scale: 0.1
    dataset: "joint"
    topk: null
    normalize: False
